<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lern-Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lern-Hub">
<meta name="theme-color" content="#17171c">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#17171c;--panel:#2b2b33;--panel2:#35353f;--line:#0b0b0e;--text:#f1efe6;--muted:#a9a7a0;--green:#5fbf3a;--gold:#f2c94c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Atkinson Hyperlegible',ui-monospace,Menlo,monospace;font-size:19px;line-height:1.45;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-image:linear-gradient(rgba(255,255,255,.025) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.025) 2px,transparent 2px);background-size:32px 32px}
h1,h2,.pix{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400}
h1{font-size:18px;margin:0;line-height:1.5}
h2{font-size:13px;margin:0 0 12px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 50px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:48px;height:48px;image-rendering:pixelated;border:3px solid var(--line)}
.panel{background:var(--panel);border:4px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.07);padding:16px;margin:16px 0}
.muted{color:var(--muted)}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
a.app{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:var(--text);background:var(--panel2);border:4px solid var(--line);padding:14px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.08);transition:transform .1s}
a.app:hover{transform:translateY(-3px)}
.ic{font-size:34px;width:56px;height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:center;background:#1d1d23;border:3px solid var(--line)}
.nm{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.6;margin-bottom:4px}
.sub{font-size:15px;color:var(--muted);line-height:1.3}
.prog{margin-top:6px;font-size:16px;color:var(--gold)}
.badge{display:inline-block;font-size:13px;background:#3c8a20;border:2px solid var(--line);padding:0 6px;margin-top:4px}
.total{display:flex;gap:18px;flex-wrap:wrap;font-size:18px}
.total b{color:var(--gold)}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pname{font-weight:700;font-size:22px}
.rankblock{width:26px;height:26px;border:3px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.35)}
.xpbar{height:22px;background:#111;border:3px solid var(--line);position:relative;margin-bottom:12px}
.xpbar>div{height:100%;background:linear-gradient(#8ff05a,#5fbf3a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;text-shadow:1px 1px 0 #000}
.mini{font-family:inherit;font-size:16px;color:var(--text);background:#6d6d78;border:3px solid var(--line);padding:4px 10px;cursor:pointer}
.mini.green{background:var(--green)}
.row{display:flex;gap:8px;align-items:center}
#nm{font-family:inherit;font-size:20px;padding:6px 8px;background:#111;color:var(--text);border:3px solid var(--line);width:200px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;background:var(--panel2);border:4px solid var(--line);padding:8px 10px}
.ach .ai{font-size:26px;width:44px;height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;background:#1d1d23;border:3px solid var(--line)}
.ach .an{font-weight:700;font-size:17px}.ach .ad{font-size:14px;color:var(--muted);line-height:1.3}
.ach .from{font-size:12px;color:var(--gold)}
.ach.got{background:#2f3a28}.ach.locked .an{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img class="logo" src="icon-192.png" alt=""><h1>Lern-Hub</h1></div>
  <div class="panel" id="prof"></div>
  <h2 style="margin-top:22px">📚 Lern-Apps</h2>
  <div class="apps" id="apps"></div>
  <div class="panel" style="margin-top:22px"><h2 id="trtitle">🏆 Trophäensammlung</h2><div class="achs" id="trophies"></div></div>
  <p style="margin-top:24px"><a class="mini" href="eltern.html" style="text-decoration:none;display:inline-block">📊 Lernprotokoll</a></p>
  <p class="muted" style="font-size:15px;margin-top:24px">Tipp: Über „Teilen → Zum Home-Bildschirm“ (iPhone) oder „⋮ → App installieren“ (Android) wird der Lern-Hub zur App mit eigenem Icon und funktioniert auch offline.</p>
</div>
<script src="shared/profil.js"></script>
<script>
/* Neue Lern-Apps hier eintragen: Ordner, Name, Icon, Beschreibung, localStorage-Schlüssel der App (für die Sterne) */
const APPS=[
  {id:'chemie-ka1',dir:'chemie-ka1/',name:'Chemie-Miner',icon:'⛏️',sub:'Chemie Klasse 9 · KA Nr. 1: Massengesetze, Formeln, Reaktionsgleichungen, Stoffmenge, Stöchiometrie',key:'chemieMinerKA1_v1',maxStars:24,isNew:false},
  {id:'bio-immun-evo',dir:'bio-immun-evo/',name:'Immun-Festung',icon:'🛡️',sub:'Biologie Klasse 9 · Infektionsverlauf, aktive/passive Immunisierung, Immunantwort, Lamarck &amp; Darwin, Weismann, Urteilsbildung Masernimpfpflicht',key:'bioImmunEvo_v1',maxStars:21,isNew:false},
  {id:'geo-plattentektonik',dir:'geo-plattentektonik/',name:'Tiefen-Expedition',icon:'🌋',sub:'Geographie Klasse 9 · Aufbau der Erde, Plattengrenzen, Antriebe, Wilson-Zyklus, Subduktion, Vulkanismus',key:'geoPlatten_v1',maxStars:18,isNew:true}
];
const H=window.LernHub,G=H.get();H.checkGlobal();
function read(k){try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderProfile(){
  const nApps=Object.keys(G.xpByApp).filter(k=>G.xpByApp[k]>0).length;
  const meta=Object.keys(G.ach).filter(k=>k.indexOf('hub:')===0).length,metaAll=H.globalList().length;
  document.getElementById('prof').innerHTML=`
   <div class="prow"><span class="pname">${G.name?esc(G.name):'<span class="muted">Noch kein Name</span>'}</span><button class="mini" id="edit">✎</button></div>
   <div class="total"><span>🔥 Serie: <b>${G.streak.days||0}</b> ${G.streak.days===1?'Tag':'Tage'}</span><span>✨ XP gesamt: <b>${G.xp}</b></span><span>🏆 Trophäen: <b>${Object.keys(G.ach).length}</b></span><span>🌍 Meta-Erfolge: <b>${meta} / ${metaAll}</b></span><span>📚 Apps: <b>${nApps}</b></span></div>
   <p class="muted" style="font-size:15px;margin:10px 0 0">Jede Lern-App hat ihren eigenen Rang und eigene Erfolge. Die Meta-Erfolge hier sammelst du über alle Apps hinweg.</p>
   <div id="editbox"></div>`;
  document.getElementById('edit').onclick=()=>{document.getElementById('editbox').innerHTML=`<div class="row" style="margin-top:10px"><input id="nm" maxlength="16" value="${esc(G.name||'')}" placeholder="Name"><button class="mini green" id="ok">Speichern</button></div>`;
    const ok=()=>{H.setName(document.getElementById('nm').value.trim());renderProfile();};document.getElementById('ok').onclick=ok;document.getElementById('nm').onkeydown=e=>{if(e.key==='Enter')ok();};document.getElementById('nm').focus();};
}
function renderApps(){
  document.getElementById('apps').innerHTML=APPS.map(a=>{
    const s=read(a.key);const st=s?Object.values(s.stars||{}).reduce((x,y)=>x+y,0):0;const info=G.apps[a.id];
    const p=info?`★ ${st}${a.maxStars?' / '+a.maxStars:''} · 🏆 ${H.countApp(a.id)} / ${info.achTotal}`:'Noch nicht gespielt';
    return `<a class="app" href="${a.dir}"><div class="ic">${a.icon}</div><div><div class="nm">${a.name}</div><div class="sub">${a.sub}</div><div class="prog">${p}</div>${a.isNew?'<span class="badge">NEU</span>':''}</div></a>`;
  }).join('');
}
function renderTrophies(){
  const appName=id=>id==='hub'?'Hub':((APPS.find(a=>a.id===id)||{}).name||id);
  const got=Object.values(G.ach).sort((a,b)=>b.t-a.t);
  const lockedGlobal=H.globalList().filter(g=>!G.ach['hub:'+g[0]]);
  document.getElementById('trtitle').textContent=`🏆 Trophäensammlung (${got.length})`;
  document.getElementById('trophies').innerHTML=got.map(a=>`<div class="ach got"><div class="ai">${a.icon}</div><div><div class="an">${esc(a.name)}</div><div class="ad">${esc(a.desc||'')}</div><div class="from">${esc(appName(a.app))}</div></div></div>`).join('')+
    lockedGlobal.map(g=>g[5]?`<div class="ach locked"><div class="ai">❓</div><div><div class="an">???</div><div class="ad">Versteckter Erfolg. Wird später enthüllt …</div><div class="from">Hub</div></div></div>`:`<div class="ach locked"><div class="ai">🔒</div><div><div class="an">${g[2]}</div><div class="ad">${g[3]}</div><div class="from">Hub</div></div></div>`).join('')+
    (got.length?'':'<p class="muted">Noch keine Trophäen. Starte eine Lern-App!</p>');
}
renderProfile();renderApps();renderTrophies();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
