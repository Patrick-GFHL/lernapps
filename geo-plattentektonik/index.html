<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiefen-Expedition – Geo KA</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern-Hub">
<meta name="theme-color" content="#17171c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17171c; --panel:#2b2b33; --panel2:#35353f; --line:#0b0b0e;
  --text:#f1efe6; --muted:#a9a7a0; --green:#5fbf3a; --green-d:#3c8a20;
  --gold:#f2c94c; --red:#e05a47; --blue:#4fa3e0; --dia:#4ee6e0; --stone:#7d7d7d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:'Atkinson Hyperlegible',ui-monospace,Menlo,Consolas,monospace;font-size:19px;line-height:1.45;
  background-image:linear-gradient(rgba(255,255,255,.025) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.025) 2px,transparent 2px);
  background-size:32px 32px;min-height:100vh}
h1,h2,h3,.pix{font-family:'Press Start 2P',ui-monospace,monospace;font-weight:400;letter-spacing:.5px}
h1{font-size:18px;margin:0;line-height:1.5}
h2{font-size:15px;margin:0 0 14px;line-height:1.6}
h3{font-size:12px;margin:0 0 8px;line-height:1.6}
sub,sup{font-size:.7em;line-height:0}
button{font-family:inherit;font-size:18px;color:var(--text);cursor:pointer}
.wrap{max-width:980px;margin:0 auto;padding:0 14px 60px}

/* ore strip */
.ores{display:flex;overflow:hidden;height:44px;border-bottom:4px solid var(--line)}
.ore{flex:0 0 44px;height:44px;position:relative;background:#6f6f6f;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:10px;color:rgba(0,0,0,.55)}
.ore i{position:absolute;width:8px;height:8px}
/* header */
header.top{background:#202027;border-bottom:4px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:12px 14px;max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;background:var(--green);box-shadow:inset -4px -4px 0 var(--green-d),inset 4px 4px 0 rgba(255,255,255,.3);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
.player{display:flex;align-items:center;gap:12px;flex:1;min-width:260px}
.rank{display:flex;align-items:center;gap:8px;font-weight:700}
.rankblock{width:22px;height:22px;border:3px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.35)}
.xpbar{flex:1;min-width:120px;height:18px;background:#111;border:3px solid var(--line);position:relative}
.xpbar>div{height:100%;background:linear-gradient(#8ff05a,#5fbf3a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:width .5s}
.xptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;text-shadow:1px 1px 0 #000}
.streak{font-weight:700;white-space:nowrap}
nav.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px;max-width:980px;margin:0 auto}

/* buttons */
.btn{background:#6d6d78;border:3px solid var(--line);padding:9px 16px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.22);text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.btn:hover{filter:brightness(1.12)}
.btn:active{box-shadow:inset 4px 4px 0 rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(1) brightness(.7);cursor:default}
.btn.green{background:var(--green)}
.btn.gold{background:#c99a1e}
.btn.red{background:#b6412f}
.btn.blue{background:#3b7fb8}
.btn.small{font-size:16px;padding:6px 12px}
.btn.on{background:var(--green)}

/* panels */
.panel{background:var(--panel);border:4px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.07);padding:18px;margin:16px 0}
.muted{color:var(--muted)}
.intro p{margin:6px 0}

/* world map */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.world{background:var(--panel2);border:4px solid var(--line);padding:14px;text-align:left;display:flex;gap:12px;align-items:flex-start;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.08);transition:transform .1s}
.world:hover{transform:translateY(-3px)}
.world .ic{font-size:36px;line-height:1;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:#1d1d23;border:3px solid var(--line);flex:0 0 52px}
.world .nm{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.6;margin-bottom:4px}
.world .tp{font-size:15px;color:var(--muted);line-height:1.3}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px;margin-top:6px}
.stars .off{color:#55545c}
.world.boss{grid-column:1/-1;background:#3a2346}
.world.locked{filter:grayscale(.8);opacity:.75}
.num-badge{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--muted)}
.tag{display:inline-block;font-size:13px;background:#5a4a1e;border:2px solid var(--line);padding:0 6px;margin-top:4px}

/* play */
.playtop{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.prog{flex:1;display:flex;gap:4px;min-width:180px}
.prog span{flex:1;height:16px;background:#111;border:3px solid var(--line)}
.prog span.ok{background:var(--green)}
.prog span.bad{background:var(--red)}
.prog span.cur{background:#777}
.hearts{font-size:22px;letter-spacing:2px}
.combo{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold)}
.q{font-size:21px;margin:6px 0 16px}
.q .eq{display:inline-block;background:#1d1d23;border:3px solid var(--line);padding:6px 12px;margin:8px 0;font-size:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.in{font-family:inherit;font-size:22px;width:170px;padding:8px 10px;background:#111;color:var(--text);border:3px solid var(--line);box-shadow:inset 3px 3px 0 rgba(0,0,0,.6)}
input.in.exp{width:80px}
input.in:focus{outline:3px solid var(--blue)}
.unit{font-size:21px}
.choices{display:grid;gap:10px}
.choices .btn{text-align:left;font-size:18px;padding:12px 14px;background:#4a4a55}
.choices .btn.right{background:var(--green)}
.choices .btn.wrong{background:var(--red)}
.fb{margin-top:16px}
.fb .ok,.fb .bad{font-family:'Press Start 2P',monospace;font-size:12px;padding:10px 12px;border:3px solid var(--line);margin-bottom:10px;line-height:1.6}
.fb .ok{background:var(--green-d)}
.fb .bad{background:#8a3328}
.sol{background:#1d1d23;border:3px solid var(--line);padding:12px 14px;font-size:18px}
.sol ol{margin:4px 0;padding-left:22px}
.hintbox{margin-top:12px;background:#4a3f1c;border:3px solid var(--line);padding:10px 12px;font-size:17px}
.taskhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.taskhead .pix{font-size:10px;color:var(--muted)}

/* element grid */
.elgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-bottom:14px}
.el{height:64px;font-family:'Press Start 2P',monospace;font-size:15px;background:#5b5b66;border:3px solid var(--line);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.2)}
.el.sel{background:var(--blue)}
.el.right{background:var(--green)}
.el.wrong{background:var(--red)}
.el.miss{outline:4px dashed var(--gold);outline-offset:-8px}

/* balance */
.bal{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:24px;margin:6px 0 14px}
.sp{display:flex;align-items:center;gap:6px;background:#1d1d23;border:3px solid var(--line);padding:6px 8px}
.sp .co{font-family:'Press Start 2P',monospace;font-size:16px;min-width:26px;text-align:center;color:var(--gold)}
.sp .st{display:flex;flex-direction:column;gap:3px}
.sp .st button{width:34px;height:26px;padding:0;font-size:16px;line-height:1;background:#5b5b66;border:2px solid var(--line)}
.op{font-size:26px;color:var(--muted)}
table.atoms{border-collapse:collapse;width:100%;font-size:17px;margin-bottom:12px}
table.atoms td,table.atoms th{border:3px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
table.atoms th{background:#1d1d23;font-weight:600}
.blk{display:inline-block;width:13px;height:13px;margin:1px;border:2px solid rgba(0,0,0,.6)}
.cnt{font-weight:700;margin-right:6px}
td.okc{background:rgba(95,191,58,.25)} td.badc{background:rgba(224,90,71,.25)}

/* order */
.orderpool,.orderlist{display:grid;gap:8px;margin-bottom:12px}
.orderlist .item{background:#1d1d23;border:3px solid var(--line);padding:8px 10px}
.orderlist .item b{color:var(--gold);margin-right:8px}

/* result */
.result{text-align:center}
.bigstars{font-size:58px;color:var(--gold);letter-spacing:6px;margin:10px 0}
.bigstars .off{color:#4d4c55}
.bigstars span{display:inline-block;animation:pop .45s both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.boss-art{display:flex;justify-content:center;margin:6px 0 4px}

/* achievements */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ach{display:flex;gap:12px;align-items:center;background:var(--panel2);border:4px solid var(--line);padding:10px 12px}
.ach .ai{font-size:30px;width:50px;height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:center;background:#1d1d23;border:3px solid var(--line)}
.ach .an{font-weight:700;font-size:18px}
.ach .ad{font-size:15px;color:var(--muted);line-height:1.3}
.ach.locked .ai{filter:grayscale(1) brightness(.5)}
.ach.locked .an{color:var(--muted)}
.ach.got{background:#2f3a28}

/* cheat sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#f3ead2;color:#2a2418;border:4px solid var(--line);padding:14px;box-shadow:inset -4px -4px 0 rgba(0,0,0,.12)}
.card h3{color:#5a3d12}
.card .f{font-size:21px;margin:4px 0}
.card table{border-collapse:collapse;width:100%;font-size:16px}
.card td{border:2px solid #b9a77a;padding:2px 6px}

/* toast */
#toasts{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:10px;z-index:50;pointer-events:none}
.toast{background:#212126;border:4px solid var(--line);box-shadow:0 0 0 3px #6d6d78;padding:10px 14px;display:flex;gap:12px;align-items:center;min-width:260px;max-width:340px;animation:tin .4s both}
.toast .ti{font-size:30px}
.toast .tt{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);line-height:1.6}
.toast .tn{font-weight:700}
.toast.out{animation:tout .4s both}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
@keyframes tout{to{transform:translateX(130%)}}
.confetti{position:fixed;top:-20px;width:12px;height:12px;z-index:40;pointer-events:none;border:2px solid rgba(0,0,0,.5);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

.calc{max-width:420px}
.cdisp{background:#a9b89c;color:#14180f;border:6px solid #1c1c1f;border-radius:6px;box-shadow:inset 3px 3px 0 rgba(0,0,0,.22);padding:8px 12px;min-height:76px;font-size:30px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;margin-bottom:12px;word-break:break-all;display:flex;flex-direction:column;justify-content:space-between}
.cdisp .cline{text-align:left;min-height:1.2em;letter-spacing:.5px}
.cdisp .ce{font-size:.78em;margin:0 1px}
.cdisp .cneg{font-size:.8em;position:relative;top:-.12em;margin-right:1px}
.cdisp .cunit{text-align:right;font-size:.55em;color:#3b4630}
.cdisp .cur{display:inline-block;width:.5em;height:.95em;margin-left:2px;background:#2a3320;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.calc .ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:#141416;border:4px solid var(--line);border-radius:10px;padding:12px}
.ck{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:600;height:54px;color:#fff;background:#2a2a2e;border:none;border-radius:9px;box-shadow:0 4px 0 #000,inset 0 1px 0 rgba(255,255,255,.12);cursor:pointer;touch-action:manipulation}
.ck:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.ck.dg{background:#e9e9ec;color:#111}
.ck.fn{background:#1f1f22;font-size:19px}
.ck.w2{grid-column:span 2}
.ck.op{background:#6f8796;font-size:24px}
.cdisp .cres{text-align:right;font-size:.95em;min-height:1.1em}
.cdisp .cop{margin:0 3px}
.ck.ok{background:#6f8796;font-size:19px}
.ck.op{background:#3a3d44;font-size:24px}
.ck.go{background:var(--green);font-size:19px}
.ck.wide{grid-column:span 2}
.cdisp .cres{text-align:right;font-size:1em;min-height:1.15em;font-weight:700}
.cdisp .cline{font-size:.8em;word-break:break-all}
.ck:disabled{filter:grayscale(1) brightness(.7)}

.curvebox{background:#1d1d23;border:3px solid var(--line);padding:6px;margin:8px 0;max-width:520px}
.curvebox svg{width:100%;height:auto;display:block;touch-action:manipulation}
.mrows{display:grid;gap:10px;margin-bottom:12px}
.mrow{background:#1d1d23;border:3px solid var(--line);padding:8px 10px}
.mrow.right{border-color:var(--green)}.mrow.wrong{border-color:var(--red)}
.ml{font-size:18px;margin-bottom:6px}
.mopts{display:flex;flex-wrap:wrap;gap:6px}
.mo,.cw,.chip{font-family:inherit;font-size:16px;color:var(--text);background:#4a4a55;border:3px solid var(--line);padding:6px 10px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.12);text-align:left}
.mo.sel,.chip.sel{background:var(--blue)}
.mo.corr{outline:3px solid var(--green);outline-offset:-3px}
.mo:disabled,.cw:disabled{cursor:default}
.cw:disabled{opacity:.35}
.ctext{font-size:20px;line-height:2.1;background:#1d1d23;border:3px solid var(--line);padding:10px 12px;margin-bottom:12px}
.slot{font-family:inherit;font-size:17px;min-width:110px;color:var(--text);background:#2b2b33;border:2px dashed #8a8a96;padding:2px 8px;margin:0 2px;cursor:pointer;vertical-align:middle}
.slot.full{border-style:solid;background:#3b5e86}
.slot.right{background:var(--green-d);border-color:var(--green)}.slot.wrong{background:#8a3328;border-color:var(--red)}
.cpool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip.right{background:var(--green)}.chip.wrong{background:var(--red)}.chip.miss{outline:3px dashed var(--gold);outline-offset:-5px}
.wt{width:100%;min-height:130px;font-family:inherit;font-size:18px;background:#111;color:var(--text);border:3px solid var(--line);padding:10px}
.checkbox-panel{background:#1d1d23;border:3px solid var(--line);padding:12px;margin-top:12px}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:17px;padding:5px 0;cursor:pointer}
label.chk input{width:22px;height:22px;flex:0 0 22px;margin-top:2px}
.prog span{display:flex;align-items:center;justify-content:center;font-size:13px;height:24px;line-height:1}
.prog span.ok,.prog span.bad{background:#2b2b33}
textarea.code{width:100%;min-height:80px;font-family:ui-monospace,monospace;font-size:13px;background:#111;color:var(--text);border:3px solid var(--line);padding:8px}
.inline-confirm{margin-top:10px;background:#4a1f1a;border:3px solid var(--line);padding:10px}
@media (max-width:560px){body{font-size:17px}.q{font-size:19px}h1{font-size:14px}}
</style>
</head>
<body>
<div class="ores" id="ores"></div>
<header class="top">
  <div class="hrow">
    <div class="brand"><a href="../" class="btn small" id="hublink" style="text-decoration:none">◀ Hub</a><div class="logo">🌋</div><h1>Tiefen-Expedition</h1></div>
    <div class="player">
      <div class="rank" id="rank"></div>
      <div class="xpbar"><div id="xpfill" style="width:0"></div><div class="xptxt" id="xptxt"></div></div>
      <div class="streak" id="streak"></div>
    </div>
  </div>
  <nav class="tabs">
    <button class="btn small" data-nav="map">🗺 Karte</button>
    <button class="btn small" data-nav="ach" id="navach">🏆 Erfolge</button>
    <button class="btn small" data-nav="sheet">📜 Lernzettel</button>
    <button class="btn small" data-nav="save">💾 Spielstand</button>
  </nav>
</header>
<main class="wrap" id="view"></main>
<div id="toasts"></div>

<script src="../shared/profil.js"></script>
<script>
"use strict";
/* ============ Daten ============ */
const KEY='geoPlatten_v1';
const A={H:1,C:12,N:14,O:16,Na:23,Mg:24,Al:27,S:32,Cl:35.5,Ca:40,Fe:56,Cu:63.5,Zn:65};
const EN={H:'Wasserstoff',C:'Kohlenstoff',N:'Stickstoff',O:'Sauerstoff',Na:'Natrium',Mg:'Magnesium',Al:'Aluminium',S:'Schwefel',Cl:'Chlor',Ca:'Calcium',Fe:'Eisen',Cu:'Kupfer',Zn:'Zink'};
const NAMES={H2O:'Wasser',CO2:'Kohlenstoffdioxid',O2:'Sauerstoff',H2:'Wasserstoff',N2:'Stickstoff',Cl2:'Chlor',NaCl:'Natriumchlorid',CH4:'Methan',NH3:'Ammoniak',MgO:'Magnesiumoxid',FeS:'Eisensulfid',HCl:'Chlorwasserstoff',H2SO4:'Schwefelsäure',CaCO3:'Calciumcarbonat',Al2O3:'Aluminiumoxid',Fe2O3:'Eisenoxid',CuO:'Kupferoxid',C2H6O:'Ethanol',ZnCl2:'Zinkchlorid',Cu2S:'Kupfersulfid',C3H8:'Propan',AlCl3:'Aluminiumchlorid',FeCl3:'Eisenchlorid',MgCl2:'Magnesiumchlorid',NaOH:'Natriumhydroxid',CO:'Kohlenstoffmonooxid',Cu2O:'rotes Kupferoxid',Na2O:'Natriumoxid',CaCl2:'Calciumchlorid',Fe:'Eisen',Mg:'Magnesium',C:'Kohlenstoff',Cu:'Kupfer',Al:'Aluminium',S:'Schwefel',Zn:'Zink',Na:'Natrium'};
const ECOL={H:'#f4f4f4',O:'#e0473a',C:'#3a3a3a',N:'#3f7be0',Cl:'#56c24a',Na:'#9b59d0',Mg:'#c9c9d6',Al:'#a9b4bf',S:'#f2d23c',Ca:'#e8e2c8',Fe:'#b8693a',Cu:'#d9813f',Zn:'#7f97a8'};
const NA=6.022e23, U=1.66e-24;

/* ============ Helfer ============ */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const r2=x=>Math.round(x*100)/100;
function fmt(x,d=2){const p=Math.pow(10,d);return (Math.round(x*p)/p).toLocaleString('de-DE',{maximumFractionDigits:d});}
function sci(x){let e=Math.floor(Math.log10(Math.abs(x)));let m=x/Math.pow(10,e);m=Math.round(m*100)/100;if(m>=10){m=m/10;e++;}return fmt(m,2)+' · 10<sup>'+e+'</sup>';}
const fx=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
const nm=f=>NAMES[f]||f;
function parseF(f){const c={};f.replace(/([A-Z][a-z]?)(\d*)/g,(_,e,n)=>{c[e]=(c[e]||0)+(n?+n:1);return '';});return c;}
function molar(f){const c=parseF(f);let s=0;for(const e in c)s+=A[e]*c[e];return Math.round(s*10)/10;}
function breakdown(f){const c=parseF(f);return Object.keys(c).map(e=>(c[e]>1?c[e]+' · ':'')+fmt(A[e],1)+' u').join(' + ');}
function coefHtml(c,f){return (c>1?c+' ':'')+fx(f);}
function eqHtml(sp,nr){const l=sp.slice(0,nr).map(s=>coefHtml(s[1],s[0])).join(' + ');const r=sp.slice(nr).map(s=>coefHtml(s[1],s[0])).join(' + ');return l+' → '+r;}
function gcd(a,b){return b?gcd(b,a%b):a;}

function drawDiag(zones,deco,st,overlay){
  let s=`<svg viewBox="0 0 340 200" class="diag" xmlns="http://www.w3.org/2000/svg">`+(deco.pre||'');
  zones.forEach(z=>{let ex='stroke="rgba(0,0,0,.45)" stroke-width="1" style="cursor:pointer"';
    if(st){if(z[0]===st.corr)ex='stroke="#5fbf3a" stroke-width="4"';else if(z[0]===st.sel)ex='stroke="#e05a47" stroke-width="4"';else ex='stroke="rgba(0,0,0,.45)" stroke-width="1"';}
    s+=shape(z,ex);});
  s+=(deco.post||'');
  if(st)zones.forEach(z=>{const [x,y]=z[4];const hi=z[0]===st.corr;s+=`<text x="${x}" y="${y}" font-size="${hi?12:10}" font-weight="${hi?700:400}" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke" style="pointer-events:none">${z[1]}</text>`;});
  if(st&&overlay)s+=overlay;
  return s+'</svg>';
}

function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.');if(s===''||isNaN(+s))return null;return +s;}
function numOk(v,t){if(v===null)return false;if(t.tol===0)return Math.abs(v-t.ans)<1e-9;const tol=t.tol||0.02;return Math.abs(v-t.ans)<=Math.max(Math.abs(t.ans)*tol,0.005);}
/* Zehnerpotenz-Eingabe: getrennte Felder ODER alles in einem Feld (6,02*10^23, 6,02·10^23, 6,02x10^23, 6,02e23, 10^-24) */
function parseSci(mStr,eStr,neg){
  let s=String(mStr||'').trim().replace(/\s/g,'').replace(/,/g,'.').replace(/[\u2212\u2013\u2014]/g,'-').replace(/[\u00b7\u00d7\u22c5xX*]/g,'*');
  let m=s.match(/^([-+]?\d*\.?\d+)\*?10\^\(?([-+]?\d+)\)?$/)||s.match(/^([-+]?\d*\.?\d+)[eE]([-+]?\d+)$/);
  if(m)return (+m[1])*Math.pow(10,+m[2]);
  m=s.match(/^10\^\(?([-+]?\d+)\)?$/);if(m)return Math.pow(10,+m[1]);
  const mant=parseNum(s);if(mant===null)return null;
  const e=String(eStr||'').trim().replace(/\s/g,'').replace(/[\u2212\u2013\u2014]/g,'-');
  if(e===''||isNaN(+e))return null;
  let ev=+e;if(neg&&ev>0)ev=-ev;
  return mant*Math.pow(10,ev);
}
/* Taschenrechner wie der TI-30X Pro: + − × ÷, Klammern, EE, (–), delete, clear, enter (= ausrechnen), Prüfen */
/* Taschenrechner wie der TI-30X Pro: Ziffern, Punkt, (–), EE, + − × ÷, Klammern, delete, clear, enter (= ausrechnen) */
function calcEval(str){
  // str: Zahlen mit Punkt, e für EE, ~ für Vorzeichen (–), Operatoren + - * /, Klammern
  let i=0;const s=str;
  function peek(){return s[i];}
  function num(){const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)(e~?\d+)?/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0].replace('~','-'));}
  function primary(){const c=peek();
    if(c==='('){i++;const v=expr();if(peek()===')')i++;return v;}  // fehlende ")" am Ende wie beim TI ergänzen
    return num();}
  function factor(){if(peek()==='~'){i++;return -factor();}const b=primary();if(peek()==='^'){i++;return Math.pow(b,factor());}return b;}
  function term(){let v=factor();while(peek()==='*'||peek()==='/'){const o=s[i++];const w=factor();v=o==='*'?v*w:v/w;}return v;}
  function expr(){let v=term();while(peek()==='+'||peek()==='-'){const o=s[i++];const w=term();v=o==='+'?v+w:v-w;}return v;}
  try{const v=expr();if(i!==s.length||!isFinite(v))return null;return v;}catch(e){return null;}
}
function calcFmt(v){if(v===0)return '0';const a=Math.abs(v);
  if(a>=1e10||a<1e-4){let e=Math.floor(Math.log10(a));let m=v/Math.pow(10,e);m=Math.round(m*1e6)/1e6;if(Math.abs(m)>=10){m/=10;e++;}return {m:String(m),e};}
  return {m:String(Math.round(v*1e9)/1e9),e:null};}
function calcPad(t,el,isSci,check){
  let tok=[],ans=null,done=false;
  const OP={'+':'+','-':'−','*':'×','/':'÷','^':'^'};
  const ex=isSci?'<b>6.022 EE 23</b> → 6.022E23 · <b>2.66 EE (–) 23</b> → 2.66E-23':'z. B. <b>2 × 56 + 3 × 16</b>, dann <b>enter</b>';
  const keys=[['del','delete','fn'],['ac','clear','fn'],['^','^','op'],['sq','x²','op'],['(','(','fn'],[')',')','fn'],['exp','EE','fn'],['/','÷','op'],['7','','dg'],['8','','dg'],['9','','dg'],['*','×','op'],['4','','dg'],['5','','dg'],['6','','dg'],['-','−','op'],['1','','dg'],['2','','dg'],['3','','dg'],['+','+','op'],['0','','dg'],['.','.','dg'],['neg','(–)','dg'],['enter','enter','ok']];
  el.innerHTML=`<div class="calc"><div class="cdisp" id="cd"></div>
    <div class="ckeys">${keys.map(([k,l,c])=>`<button type="button" class="ck ${c||''}" data-key="${k}">${l||k}</button>`).join('')}</div>
    <button type="button" class="btn green" id="calcok" style="width:100%;margin-top:10px;font-size:20px">✔ Ergebnis prüfen</button>
    <div class="muted" style="font-size:15px;margin-top:8px">Rechne wie auf deinem TI-30X Pro: ${ex}. Mit <b>enter</b> rechnest du aus, mit <b>Ergebnis prüfen</b> gibst du ab. Zehnerpotenzen mit <b>EE</b>, negative Zahlen mit <b>(–)</b>, Hochzahlen mit <b>^</b> (z. B. 2^15).</div>
    <div id="scimsg" class="hintbox" style="display:none"></div></div>`;
  const cd=$('#cd');
  const isOp=x=>x in OP;
  function toStr(){return tok.map(x=>x==='E'?'e':x==='neg'?'~':x).join('');}
  function draw(){
    const line=tok.map(x=>x==='E'?'<span class="ce">E</span>':x==='neg'?'<span class="cneg">-</span>':isOp(x)?`<span class="cop">${OP[x]}</span>`:x).join('');
    let res='';if(done&&ans!==null){const f=calcFmt(ans);res=f.m.replace('-','<span class="cneg">-</span>')+(f.e!==null?`<span class="ce">E</span>${f.e<0?'<span class="cneg">-</span>':''}${Math.abs(f.e)}`:'');}
    cd.innerHTML=`<div class="cline">${line}${done?'':'<span class="cur"></span>'}</div><div class="cres">${res}<span class="cunit">${t.unit}</span></div>`;
  }
  function compute(){const v=calcEval(toStr());if(v===null){msg('Die Rechnung ist so nicht vollständig, prüfe Klammern und Rechenzeichen.');return false;}ans=v;done=true;return true;}
  function msg(m){const x=$('#scimsg');x.style.display='block';x.innerHTML=m;}
  function press(k){
    if(!P||P.answered||!document.getElementById('cd'))return;$('#scimsg').style.display='none';
    if(done&&k!=='enter'&&k!=='del'&&k!=='ac'){
      if(isOp(k)){const f=calcFmt(ans);tok=[...(f.m.startsWith('-')?['neg',...f.m.slice(1)]:f.m)];if(f.e!==null){tok.push('E');if(f.e<0)tok.push('neg');tok.push(...String(Math.abs(f.e)));}}
      else tok=[];

    else if(k==='.'){if(last===')')tok.push('*');tok.push('.');}

    else if(isOp(k)){if(!tok.length&&ans!==null){const f=calcFmt(ans);tok=[...(f.m.startsWith('-')?['neg',...f.m.slice(1)]:f.m)];if(f.e!==null){tok.push('E');if(f.e<0)tok.push('neg');tok.push(...String(Math.abs(f.e)));}}const l2=tok[tok.length-1];if(l2&&isOp(l2))tok[tok.length-1]=k;else if(tok.length)tok.push(k);}
    else if(k==='sq'){if(last&&/[0-9.)]/.test(last)){tok.push('^','2');}}

   <div class="card"><h3>Antriebe</h3><p><b>Plattenzug</b>: abtauchende, schwere Platte zieht den Rest nach (stärkster Antrieb).<br><b>Rückendruck</b>: am Mittelozeanischen Rücken werden die Platten auseinandergedrückt, sie gleiten ab.<br><b>Asthenosphärenantrieb</b>: Konvektionsströme nehmen die Platten durch Reibung mit.</p><p>Energie: Wärme im Erdinneren.</p></div>
   <div class="card"><h3>Wilson-Zyklus</h3><p>1. kontinentales Rift (Ostafrika) → 2. ozeanisches Rift (Rotes Meer) → 3. seafloor spreading am Mittelozeanischen Rücken (Atlantik) → 4. Subduktion, Ozean schrumpft (Pazifik) → 5. Kollision → 6. Suturzone, Deformation, Faltengebirge (Himalaya) → von vorn.</p><p><b>Recycling:</b> Kruste entsteht am Rücken und verschwindet in der Subduktionszone.</p></div>
   <div class="card"><h3>Subduktionszone</h3><p>Dichtere ozeanische Platte taucht ab → <b>Tiefseegraben</b> (Marianengraben ca. 11 km).<br><b>Wadati-Benioff-Zone</b>: schräg abtauchende Zone der Erdbebenherde (bis ca. 700 km).<br>In ca. 100 km Tiefe wird Wasser frei → Gestein schmilzt → Magma → Vulkane.<br><b>Ring of fire</b>: Vulkan- und Erdbebengürtel rund um den Pazifik.</p></div>
   <div class="card"><h3>Vulkanismus</h3><p><b>Magma</b> (innen) / <b>Lava</b> (außen) · Magmakammer · Schlot · Krater · Aschewolke · pyroklastischer Strom.</p><p><b>Pluton</b>: in der Kruste erstarrtes Magma (z. B. Granit).<br><b>Hot Spot</b>: ortsfester Aufstieg heißen Mantelmaterials, unabhängig von Plattengrenzen → Inselkette (Hawaii).</p><p><b>Schichtvulkan</b>: zähflüssig, explosiv, steil (Subduktion). <b>Schildvulkan</b>: dünnflüssig, ruhig, flach (Hot Spot).</p></div>
  </div>`;
}

/* ============ Spielstand ============ */
function renderSave(){
  let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify({v:2,app:APP,state:S,profil:H.exportData()}))));}catch(e){}
  view.innerHTML=`<div class="panel"><h2>💾 Spielstand</h2>
   <p>Name: <input class="in" id="nm2" maxlength="16" value="${(H.get().name||'').replace(/"/g,'&quot;')}" style="width:220px"> <button class="btn small green" id="nmsave">Speichern</button></p>
   <p class="muted">Dein Fortschritt wird automatisch auf diesem Gerät gespeichert. Der Speichercode enthält diese App <b>und</b> dein Hub-Profil (Name, Serie, Trophäen-Vitrine, Meta-Erfolge). Für ein anderes Gerät oder zur Sicherheit kopierst du ihn und fügst ihn dort unter „Laden“ ein.</p>
   <h3>Speichercode</h3><textarea class="code" id="code" readonly>${code}</textarea>
   <div class="row" style="margin-top:8px"><button class="btn blue small" id="copy">📋 Kopieren</button><span id="copymsg" class="muted"></span></div>
   <h3 style="margin-top:20px">Laden</h3><textarea class="code" id="imp" placeholder="Speichercode hier einfügen"></textarea>
   <div class="row" style="margin-top:8px"><button class="btn green small" id="load">Laden</button><span id="loadmsg"></span></div>
   <h3 style="margin-top:20px">Neu anfangen</h3><button class="btn red small" id="reset">Diese App zurücksetzen</button><div id="rsbox"></div></div>`;
  $('#nmsave').onclick=()=>{H.setName($('#nm2').value.trim());updateHeader();};
  $('#copy').onclick=()=>{const ta=$('#code');try{navigator.clipboard.writeText(ta.value).then(()=>$('#copymsg').textContent='Kopiert!',()=>{ta.select();$('#copymsg').textContent='Markiert, jetzt mit Strg+C kopieren.';});}catch(e){ta.select();$('#copymsg').textContent='Markiert, jetzt mit Strg+C kopieren.';}};
  $('#load').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim()))));if(o.v===2){H.importData(o.profil);S=merge(defState(),o.state);lastRank=rankIdx(S.xp);}else if(typeof o.xp==='number'){S=merge(defState(),o);migrate(true);}else throw 0;save();updateHeader();$('#loadmsg').textContent=' ✔ Geladen!';}catch(e){$('#loadmsg').textContent=' ✘ Der Code ist ungültig.';}};
  $('#reset').onclick=()=>{$('#rsbox').innerHTML=`<div class="inline-confirm">Rang, Sterne und Erfolge dieser App löschen? (Meta-Erfolge im Hub bleiben erhalten.) <button class="btn red small" id="rsyes">Ja, löschen</button> <button class="btn small" id="rsno">Abbrechen</button></div>`;
    $('#rsyes').onclick=()=>{S=defState();const G=H.get();Object.keys(G.ach).forEach(k=>{if(k.indexOf(APP+':')===0)delete G.ach[k];});H.importData(G);lastRank=0;save();registerApp();updateHeader();renderMap();};$('#rsno').onclick=()=>{$('#rsbox').innerHTML='';};};
}

/* ============ Start ============ */
/* Alten Spielstand (vor dem gemeinsamen Profil) einmalig übernehmen */
function migrate(force){const G=H.get();if(!force&&(S.migrated||!(S.xp>0)))return;
  if(force||!G.xpByApp[APP]){G.xp+=S.xp;G.xpByApp[APP]=(G.xpByApp[APP]||0)+S.xp;}
  if(S.name&&!G.name)G.name=S.name;
  if(S.streak&&S.streak.days>(G.streak.days||0))G.streak=S.streak;
  if(S.ach)ACH.forEach(([id,ic,n,d])=>{if(S.ach[id]&&!G.ach[APP+':'+id])G.ach[APP+':'+id]={t:S.ach[id],app:APP,icon:ic,name:n,desc:d};});
  H.importData(G);S.migrated=true;save();}
migrate(false);
oreStrip();updateHeader();renderMap();checkAch();H.checkGlobal();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});});}
</script>
